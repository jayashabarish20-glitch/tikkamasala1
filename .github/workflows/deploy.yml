name: Deploy Tikka Masala

on:
  push:
    branches:
      - main

concurrency:
  group: tikkamasala-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is missing"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/tikkamasala.pem
          chmod 600 ~/.ssh/tikkamasala.pem

      - name: Validate EC2 host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is missing"
            exit 1
          fi

          echo "EC2 host is configured"

      - name: Add EC2 to known hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Testing SSH connection..."

          ssh \
            -i ~/.ssh/tikkamasala.pem \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "ubuntu@$EC2_HOST" \
            "echo 'SSH connection successful'"

      - name: Prepare EC2 environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -i ~/.ssh/tikkamasala.pem \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "ubuntu@$EC2_HOST" 'bash -s' <<'REMOTE_SETUP'

          set -e

          echo "========================================"
          echo "       PREPARING EC2 ENVIRONMENT"
          echo "========================================"

          echo "Updating package lists..."
          sudo apt-get update

          echo "Installing required base packages..."
          sudo apt-get install -y \
            git \
            curl \
            ca-certificates \
            gnupg \
            lsb-release

          echo "Checking Docker installation..."

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker not found. Installing Docker..."

            sudo install -m 0755 -d /etc/apt/keyrings

            sudo curl -fsSL \
              https://download.docker.com/linux/ubuntu/gpg \
              -o /etc/apt/keyrings/docker.asc

            sudo chmod a+r /etc/apt/keyrings/docker.asc

            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

            sudo apt-get update

            sudo apt-get install -y \
              docker-ce \
              docker-ce-cli \
              containerd.io \
              docker-buildx-plugin \
              docker-compose-plugin

            sudo systemctl enable docker
            sudo systemctl start docker

            echo "Docker installation completed."
          else
            echo "Docker already installed."

            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin missing."
              echo "Installing Docker Compose plugin..."

              sudo apt-get update

              sudo apt-get install -y \
                docker-compose-plugin
            fi
          fi

          echo "Checking Docker service..."

          if ! sudo systemctl is-active --quiet docker; then
            echo "Docker service is not running. Starting Docker..."
            sudo systemctl start docker
          fi

          echo "Checking Git..."
          git --version

          echo "Checking Docker..."
          sudo docker --version

          echo "Checking Docker Compose..."
          sudo docker compose version

          echo "Checking curl..."
          curl --version | head -n 1

          echo "Adding ubuntu user to docker group..."

          sudo usermod -aG docker ubuntu || true

          echo ""
          echo "========================================"
          echo "     EC2 ENVIRONMENT READY"
          echo "========================================"

          REMOTE_SETUP

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -i ~/.ssh/tikkamasala.pem \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "ubuntu@$EC2_HOST" 'bash -s' <<'REMOTE_SCRIPT'

          set -e

          echo "========================================"
          echo "       TIKKA MASALA DEPLOYMENT"
          echo "========================================"

          APP_DIR="/home/ubuntu/tikkamasala1"
          REPO_URL="https://github.com/jayashabarish20-glitch/tikkamasala1.git"

          echo "Checking application directory..."

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "Application directory does not exist."
            echo "Cloning repository..."

            rm -rf "$APP_DIR"
            git clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"

          echo "Current directory:"
          pwd

          echo "Pulling latest code..."

          git fetch origin main
          git reset --hard origin/main

          echo "Checking required files..."

          test -f docker-compose.yml
          test -f backend/Dockerfile
          test -f frontend/Dockerfile

          echo "Required files found."

          echo "Checking .env..."

          if [ ! -f .env ]; then
            echo "ERROR: .env file not found"
            echo "Create /home/ubuntu/tikkamasala1/.env on EC2"
            exit 1
          fi

          echo ".env file found."

          echo "Checking Docker..."

          sudo docker --version
          sudo docker compose version

          echo "Building and starting containers..."

          sudo docker compose up -d --build --remove-orphans

          echo "Container status:"
          sudo docker compose ps

          echo "Checking backend health..."

          BACKEND_OK=false

          for i in $(seq 1 10); do
            if curl --fail --silent --show-error http://localhost:8000/health; then
              echo
              echo "Backend health check passed."
              BACKEND_OK=true
              break
            fi

            echo "Backend not ready. Attempt $i/10..."
            sleep 5
          done

          if [ "$BACKEND_OK" != "true" ]; then
            echo "ERROR: Backend health check failed."
            sudo docker compose logs backend --tail=100
            exit 1
          fi

          echo "Checking frontend..."

          if curl --fail --silent --show-error http://localhost:8080 > /dev/null; then
            echo "Frontend health check passed."
          else
            echo "ERROR: Frontend health check failed."
            sudo docker compose logs frontend --tail=100
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "      DEPLOYMENT SUCCESSFUL"
          echo "========================================"

          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/tikkamasala.pem