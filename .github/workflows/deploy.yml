      - name: Test SSH connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Testing SSH to EC2..."

          ssh \
            -i ~/.ssh/tikkamasala.pem \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "ubuntu@$EC2_HOST" \
            "echo 'SSH connection successful'"

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -i ~/.ssh/tikkamasala.pem \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "ubuntu@$EC2_HOST" << 'EOF'

          set -e

          APP_DIR="/home/ubuntu/tikkamasala1"
          REPO_URL="https://github.com/jayashabarish20-glitch/tikkamasala1.git"

          echo "Checking application directory..."

          if [ ! -d "$APP_DIR/.git" ]; then
              echo "Application directory not found."
              echo "Cloning repository..."

              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"

          echo "Current directory:"
          pwd

          echo "Pulling latest code..."

          git fetch origin main
          git reset --hard origin/main

          echo "Checking required files..."

          test -f docker-compose.yml
          test -f backend/Dockerfile
          test -f frontend/Dockerfile

          if [ ! -f .env ]; then
              echo "ERROR: .env not found"
              exit 1
          fi

          echo "Building and starting containers..."

          docker compose up -d --build --remove-orphans

          echo "Container status..."

          docker compose ps

          echo "Checking backend health..."

          for i in {1..10}; do
              if curl --fail --silent --show-error \
                  http://localhost:8000/health; then

                  echo
                  echo "Backend health check passed."
                  break

              fi

              if [ "$i" -eq 10 ]; then
                  echo "Backend health check failed."
                  docker compose logs backend --tail=100
                  exit 1
              fi

              echo "Waiting for backend..."
              sleep 5
          done

          echo "Checking frontend..."

          if curl --fail --silent --show-error \
              http://localhost:8080 > /dev/null; then

              echo "Frontend health check passed."

          else

              echo "Frontend health check failed."
              docker compose logs frontend --tail=100
              exit 1

          fi

          echo "========================================"
          echo "DEPLOYMENT SUCCESSFUL ✅"
          echo "========================================"

          EOF